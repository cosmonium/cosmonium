[tool.ruff]
line-length = 120
target-version = "py310"
builtins = ["_"]
extend-exclude = [
    "third-party",
    "source",
    "tools/p3d_module_builder",
    "data",
    "build",
    "dist",
    "wip",
    "*_parsetab.py",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# Equivalent of the flake8 defaults (pycodestyle + pyflakes) plus isort
select = ["E", "W", "F", "I"]

[tool.pydocstyle]
convention = "pep257"
add_select = ["D417"]
match = "(?!test_).*\\.py"
match_dir = "^(?!(third-party|source|tools|data|build|dist|wip|\\..*)$).*"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "third-party/",
    "source/",
    "tools/p3d_module_builder/",
    "data/",
    "build/",
    "dist/",
    "wip/",
    ".*_parsetab\\.py$"
]

[tool.pytest]
testpaths = ['tests']
