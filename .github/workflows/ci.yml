name: build
on: [push, pull_request]
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Checkout submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive --depth=1
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config fakeroot python3-dev python3-setuptools software-properties-common libpng-dev libjpeg-dev libtiff-dev zlib1g-dev libssl-dev libx11-dev libgl1-mesa-dev libxrandr-dev libxxf86dga-dev libxcursor-dev bison flex libfreetype6-dev libvorbis-dev libeigen3-dev libopenal-dev libode-dev libbullet-dev nvidia-cg-toolkit libgtk2.0-dev libassimp-dev libopenexr-dev libopusfile-dev libsquish-dev libavcodec-dev libavutil-dev libavformat-dev libswscale-dev
        sudo apt-get install -y gettext libblas3
        curl -L https://github.com/cosmonium/panda3d/releases/download/cosmonium-v1.11.0.dev3844-g062e3365fd/panda3d1.11_1.11.0.dev3844.jammy_amd64.deb -o panda3d1.11_1.11.0.jammy_amd64.deb
        sudo dpkg -i panda3d1.11_1.11.0.jammy_amd64.deb
        curl -L https://github.com/cosmonium/panda3d/releases/download/cosmonium-v1.11.0.dev3844-g062e3365fd/panda3d-1.11.0.dev3844+fp64-cp310-cp310-linux_x86_64.whl -o panda3d-1.11.0-cp310-cp310-linux_x86_64.whl
    - name: Build app
      run: |
        pip3.10 install -r requirements-dev.txt
        echo "panda3d-1.11.0-cp310-cp310-linux_x86_64.whl" > requirements-build.txt
        cat requirements.txt >> requirements-build.txt
        make build
        python3.10 setup.py bdist_apps -p linux_x86_64 -r requirements-build.txt
    - name: Test binary
      run: |
        cd build/linux_x86_64
        ./cosmonium --test-start
    - name: Upload logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v5
      with:
        name: linux-logs
        path: ~/.cache/cosmonium/log/output.log

  build-macos:
    runs-on: macos-15-intel
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Checkout submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive --depth=1
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: 3.10.19
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Install Panda3D wheel
      run: |
        curl -L https://github.com/cosmonium/panda3d/releases/download/cosmonium-v1.11.0.dev3844-g062e3365fd/panda3d-1.11.0.dev3844+fp64-cp310-cp310-macosx_10_9_x86_64.whl -o panda3d-1.11.0-cp310-cp310-macosx_10_9_x86_64.whl
        python -m pip install panda3d-1.11.0-cp310-cp310-macosx_10_9_x86_64.whl
    - name: Build binary
      run: |
        echo "panda3d-1.11.0-cp310-cp310-macosx_10_9_x86_64.whl" > requirements-tmp.txt
        cat requirements.txt >> requirements-tmp.txt
        python setup.py bdist_apps -p macosx_10_9_x86_64 -r requirements-tmp.txt
    - name: Test binary
      run: |
        cd build/macosx_10_9_x86_64/cosmonium.app/Contents/MacOS
        ./cosmonium --test-start
    - name: Upload logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v5
      with:
        name: macos-logs
        path: ~/Library/Logs/cosmonium/output.log

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Checkout submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive --depth=1
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install pip
      run: |
        python -m pip install --upgrade pip
    - name: Install Panda3D wheel
      shell: powershell
      run: |
        $wc = New-Object System.Net.WebClient
        $wc.DownloadFile("https://github.com/cosmonium/panda3d/releases/download/cosmonium-v1.11.0.dev3844-g062e3365fd/panda3d-1.11.0.dev3844+fp64-cp310-cp310-win_amd64.whl", "panda3d-1.11.0+fp64-cp310-cp310-win_amd64.whl")
        python -m pip install panda3d-1.11.0+fp64-cp310-cp310-win_amd64.whl
    - name: Build binary
      run: |
        echo "panda3d-1.11.0+fp64-cp310-cp310-win_amd64.whl" > requirements-tmp.txt
        cat requirements.txt >> requirements-tmp.txt
        python setup.py bdist_apps -p win_amd64 -r requirements-tmp.txt
    - name: Test binary
      run: |
        cd build/win_amd64
        ./cosmonium.exe --test-start | Out-Null
    - name: Upload logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v5
      with:
        name: windows-logs
        path: ~/AppData/Local/Cosmonium/Logs/output.log
