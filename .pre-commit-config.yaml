repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(third-party/|source/|tools/p3d_module_builder/|data/|build/|dist/|.*_parsetab\.py$)
      - id: end-of-file-fixer
        exclude: ^(third-party/|source/|tools/p3d_module_builder/|data/|build/|dist/|.*_parsetab\.py$)
      - id: check-yaml
        exclude: ^(third-party/|source/|tools/p3d_module_builder/|data/|build/|dist/)
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^(third-party/|source/|data/|build/|dist/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
