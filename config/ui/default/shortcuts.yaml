# Keyboard and mouse shortcuts for the default UI skin.
#
# Shortcuts are grouped by category, which is used to organize the generated
# control help document (see `gui-show-help`). Each shortcut defines the
# event it triggers and one or more `keys` (a single key combination, or a
# list of them). A shortcut may declare `args`, sent along with the event, to
# avoid having to define a new event for every variant of an action (e.g.
# `select-object` reuses the same event for every digit key, only the
# argument changes). Shortcuts sharing the same `link` id are variants of the
# same action (e.g. increase/decrease a value) and are merged into a single
# entry in the control help document.
#
# An event's description, shown in that document, is defined in code (see
# `cosmonium/ui/shortcut_descriptions.py`) since it does not depend on the
# skin. A shortcut can set its own `description` to override it.

- category: Application
  shortcuts:
    - event: exit
      keys: control-q
    - event: escape-dispatch
      keys: escape

- category: Mouse
  shortcuts:
    - event: select-or-center
      keys: mouse1-click
    - event: gui-show-context-menu
      keys: mouse3-click

- category: Selection and tracking
  shortcuts:
    - event: follow-selected
      keys: f
    - event: sync-selected
      keys: y
    - event: track-selected
      keys: t
    - event: control-selected
      keys: shift-alt-t
    - event: goto-front
      link: goto-front
      keys: alt-d
    - event: goto-illuminated-front
      link: goto-front
      keys: shift-control-alt-d
    - event: goto-selected
      keys: g
    - event: center-selected
      keys: c
    - event: goto-north
      link: goto-pole
      keys: alt-n
    - event: goto-south
      link: goto-pole
      keys: shift-alt-n
    - event: goto-meridian
      keys: alt-r
    - event: align-ecliptic
      keys: alt-e
    - event: align-equatorial
      keys: alt-q
    - event: goto-surface
      keys: control-alt-g
    - event: select-home
      keys: alt-h
    - event: select-object
      keys:
        - key: "0"
          args: [0]
        - key: "1"
          args: [1]
        - key: "2"
          args: [2]
        - key: "3"
          args: [3]
        - key: "4"
          args: [4]
        - key: "5"
          args: [5]
        - key: "6"
          args: [6]
        - key: "7"
          args: [7]
        - key: "8"
          args: [8]
        - key: "9"
          args: [9]

