dock:
 - anchor: bottom
   orientation: horizontal
   gap: 2px
   padding: 2px
   widgets:
      - type: text
        text: "A"
      - type: layout
        orientation: horizontal
        class: large-icons
        widgets:
          - type: button
            code: F0F65
            event: toggle-label-moon
          - type: button
            code: F09BA
            code_checked: F0F65
            checked: 'not time.is_running'
      - type: layout
        orientation: vertical
        gap: 2px
        widgets:
          - type: text
            text: '{time.date}'
            margin: 2px
          - type: layout
            orientation: horizontal
            widgets:
               - type: button
                 code: F03E4
                 code_checked: F040A
                 justify: left
                 checked: 'not time.is_running'
                 tooltip: Toggle freeze time
                 event: toggle-freeze-time
               - type: button
                 code: F0F86
                 tooltip: Deccelerate time
                 event: slow-time-2
               - type: button
                 code: F0F85
                 tooltip: Real time
                 event: set-real-time
               - type: button
                 code: F04C5
                 tooltip: Accelerate time
                 event: accelerate-time-2
               - type: spacer
                 size: [1em, 1em]
                 grow: 10
               - type: button
                 code: F0150
                 tooltip: Current time
                 event: set-current-date
      - type: button
        text: "M"
      - type: layout
        orientation: vertical
        widgets:
           - type: button
             text: "A"
           - type: button
             text: "B"
